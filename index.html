<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YachtieAssist - Email Verification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #FFD700;
        }
        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ccc;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #FFD700;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #ff6b6b;
            margin-top: 20px;
        }
        .success {
            color: #51cf66;
        }
        a {
            color: #FFD700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚓</div>
        <h1>Email Verified!</h1>
        <p id="message">Redirecting to YachtieAssist app...</p>
        <div class="spinner" id="spinner"></div>
        <p id="error" class="error" style="display: none;"></p>
    </div>

    <script>
        console.log('🔗 Redirect page loaded');
        console.log('🔗 Current URL:', window.location.href);
        
        // Function to get URL parameters
        function getUrlParams() {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const queryParams = new URLSearchParams(window.location.search);
            
            // Combine both hash and query parameters
            const params = {};
            
            // Check hash first (Supabase usually puts tokens here)
            for (const [key, value] of hashParams) {
                params[key] = value;
            }
            
            // Then check query string
            for (const [key, value] of queryParams) {
                if (!params[key]) {
                    params[key] = value;
                }
            }
            
            return params;
        }
        
        // Function to redirect to app
        function redirectToApp() {
            const params = getUrlParams();
            
            console.log('📦 Extracted params:', params);
            
            const accessToken = params.access_token;
            const refreshToken = params.refresh_token;
            const type = params.type;
            const errorParam = params.error;
            const errorDescription = params.error_description;
            
            // If there's an error, show it
            if (errorParam) {
                console.error('❌ Error from Supabase:', errorParam, errorDescription);
                document.getElementById('message').textContent = 'Verification failed';
                document.getElementById('error').textContent = errorDescription || errorParam;
                document.getElementById('error').style.display = 'block';
                document.getElementById('spinner').style.display = 'none';
                return;
            }
            
            // If we have tokens, redirect to app with them
            if (accessToken && refreshToken) {
                console.log('✅ Found tokens, redirecting to app...');
                
                const deepLink = `yachtieassist://auth/callback#access_token=${accessToken}&refresh_token=${refreshToken}&type=${type || 'signup'}`;
                
                console.log('🚀 Redirecting to:', deepLink.substring(0, 50) + '...');
                
                document.getElementById('message').textContent = 'Opening YachtieAssist...';
                document.getElementById('message').classList.add('success');
                
                // Try to redirect
                window.location.href = deepLink;
                
                // Show fallback message after 3 seconds
                setTimeout(() => {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('message').innerHTML = 'If the app didn\'t open automatically,<br><a href="' + deepLink + '">tap here to open YachtieAssist</a>';
                }, 3000);
            } else {
                // No tokens found - this is the problem!
                console.error('❌ No access_token or refresh_token found in URL');
                console.log('📋 Available params:', Object.keys(params));
                
                document.getElementById('message').textContent = 'Verification in progress...';
                document.getElementById('error').textContent = 'No authentication tokens received. Please try signing up again.';
                document.getElementById('error').style.display = 'block';
                document.getElementById('spinner').style.display = 'none';
            }
        }
        
        // Run redirect on page load
        try {
            redirectToApp();
        } catch (error) {
            console.error('❌ Error during redirect:', error);
            document.getElementById('message').textContent = 'Verification failed';
            document.getElementById('error').textContent = 'An error occurred. Please try again.';
            document.getElementById('error').style.display = 'block';
            document.getElementById('spinner').style.display = 'none';
        }
    </script>
</body>
</html>
