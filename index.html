<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YachtieAssist - Email Verification</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #FFD700;
        }
        p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ccc;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #FFD700;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #ff6b6b;
            margin-top: 20px;
        }
        .success {
            color: #51cf66;
        }
        a {
            color: #FFD700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚓</div>
        <h1>Email Verified!</h1>
        <p id="message">Email verified! Tap the button below to open YachtieAssist.</p>
        <div class="spinner" id="spinner" style="display: none;"></div>
        <a id="openAppButton" href="#" style="margin-top: 30px; padding: 15px 40px; background: #FFD700; color: #1a1a2e; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 18px;">Open YachtieAssist</a>
        <p id="error" class="error" style="display: none;"></p>
    </div>

    <script>
        console.log('🔗 Redirect page loaded');
        console.log('🔗 Current URL:', window.location.href);
        console.log('🔗 Hash:', window.location.hash);
        console.log('🔗 Search:', window.location.search);
        
        // Function to get URL parameters from both hash and query string
        function getUrlParams() {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const queryParams = new URLSearchParams(window.location.search);
            
            // Combine both hash and query parameters
            const params = {};
            
            // Check hash first (Supabase auth tokens are usually here)
            for (const [key, value] of hashParams) {
                params[key] = value;
                console.log('  Hash param:', key, '=', value.substring(0, 20) + '...');
            }
            
            // Then check query string
            for (const [key, value] of queryParams) {
                if (!params[key]) {
                    params[key] = value;
                    console.log('  Query param:', key, '=', value);
                }
            }
            
            return params;
        }
        
        // Function to redirect to app
        async function redirectToApp() {
            const params = getUrlParams();
            
            console.log('📦 All extracted params:', Object.keys(params));
            
            const accessToken = params.access_token;
            const refreshToken = params.refresh_token;
            const type = params.type;
            const errorParam = params.error;
            const errorDescription = params.error_description;
            
            // If there's an error, show it
            if (errorParam) {
                console.error('❌ Error from Supabase:', errorParam, errorDescription);
                document.getElementById('message').textContent = 'Verification failed';
                document.getElementById('error').textContent = errorDescription || errorParam;
                document.getElementById('error').style.display = 'block';
                document.getElementById('spinner').style.display = 'none';
                return;
            }
            
            // If we have tokens in the URL, redirect to app immediately
            if (accessToken && refreshToken) {
                console.log('✅ Found tokens in URL, redirecting to app...');
                
                const deepLink = `yachtieassist://auth/callback#access_token=${encodeURIComponent(accessToken)}&refresh_token=${encodeURIComponent(refreshToken)}&type=${type || 'signup'}`;
                
                console.log('🚀 Redirecting to app with tokens...');
                
                document.getElementById('message').textContent = 'Opening YachtieAssist...';
                document.getElementById('message').classList.add('success');
                
                // Try multiple methods to open the app
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = deepLink;
                document.body.appendChild(iframe);
                
                setTimeout(() => {
                    window.location.href = deepLink;
                }, 100);
                
                // Show manual button after 2 seconds
                setTimeout(() => {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('message').textContent = 'Tap the button below to open YachtieAssist';
                    const button = document.getElementById('openAppButton');
                    button.href = deepLink;
                    button.style.display = 'inline-block';
                }, 2000);
                
                return;
            }
            
            // If we don't have tokens in the URL, Supabase verification happened server-side
            // We need to pass the VERIFICATION TOKEN from the URL to the app
            // so the app can exchange it for a session
            console.log('⚠️ No access_token/refresh_token in URL');
            console.log('⚠️ Checking for verification token or token_hash...');
            
            const tokenHash = params.token_hash;
            const token = params.token;
            const type = params.type;
            
            if (tokenHash || token) {
                console.log('✅ Found verification token! Passing to app...');
                
                // Build deep link with the verification token
                const verificationToken = tokenHash || token;
                const deepLinkWithToken = `yachtieassist://auth/callback?token_hash=${encodeURIComponent(verificationToken)}&type=${type || 'signup'}`;
                
                console.log('🚀 Opening app with verification token...');
                
                document.getElementById('message').textContent = 'Opening YachtieAssist...';
                document.getElementById('message').classList.add('success');
                
                // Try multiple methods to open the app
                // Method 1: Create hidden iframe (works better on iOS Safari)
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = deepLinkWithToken;
                document.body.appendChild(iframe);
                
                // Method 2: Try window.location after a small delay
                setTimeout(() => {
                    window.location.href = deepLinkWithToken;
                }, 100);
                
                // Method 3: Show manual button after 2 seconds
                setTimeout(() => {
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('message').textContent = 'Tap the button below to open YachtieAssist';
                    const button = document.getElementById('openAppButton');
                    button.href = deepLinkWithToken;
                    button.style.display = 'inline-block';
                }, 2000);
                
                return;
            }
            
            // Last resort: just open the app and hope it can fetch the session
            console.log('⚠️ No tokens found at all - opening app anyway...');
            
            const simpleDeepLink = 'yachtieassist://auth/callback';
            
            console.log('🚀 Opening app without tokens (app will try to fetch session)...');
            
            document.getElementById('message').textContent = 'Opening YachtieAssist...';
            document.getElementById('message').classList.add('success');
            
            // Try multiple methods to open the app
            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = simpleDeepLink;
            document.body.appendChild(iframe);
            
            setTimeout(() => {
                window.location.href = simpleDeepLink;
            }, 100);
            
            // Show manual button after 2 seconds
            setTimeout(() => {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('message').textContent = 'Tap the button below to open YachtieAssist';
                const button = document.getElementById('openAppButton');
                button.href = simpleDeepLink;
                button.style.display = 'inline-block';
            }, 2000);
        }
        
        // Simple function to set up the button
        function setupButton() {
            const params = getUrlParams();
            console.log('📦 All extracted params:', Object.keys(params));
            
            const accessToken = params.access_token;
            const refreshToken = params.refresh_token;
            const tokenHash = params.token_hash;
            const token = params.token;
            const type = params.type;
            const errorParam = params.error;
            const errorDescription = params.error_description;
            
            // If there's an error, show it
            if (errorParam) {
                console.error('❌ Error from Supabase:', errorParam, errorDescription);
                document.getElementById('message').textContent = 'Verification failed';
                document.getElementById('error').textContent = errorDescription || errorParam;
                document.getElementById('error').style.display = 'block';
                return;
            }
            
            let deepLink = 'yachtieassist://auth/callback';
            
            // If we have access_token and refresh_token, use them
            if (accessToken && refreshToken) {
                console.log('✅ Found tokens in URL');
                deepLink = `yachtieassist://auth/callback#access_token=${encodeURIComponent(accessToken)}&refresh_token=${encodeURIComponent(refreshToken)}&type=${type || 'signup'}`;
            }
            // If we have verification token, use it
            else if (tokenHash || token) {
                console.log('✅ Found verification token');
                const verificationToken = tokenHash || token;
                deepLink = `yachtieassist://auth/callback?token_hash=${encodeURIComponent(verificationToken)}&type=${type || 'signup'}`;
            }
            else {
                console.log('⚠️ No tokens found - using simple deep link');
            }
            
            console.log('🔗 Deep link:', deepLink);
            
            // Set the button URL
            const button = document.getElementById('openAppButton');
            button.href = deepLink;
            
            // Try to auto-open the app after 1 second
            setTimeout(() => {
                console.log('🚀 Attempting to open app...');
                window.location.href = deepLink;
            }, 1000);
        }
        
        // Set up the button immediately
        try {
            setupButton();
        } catch (error) {
            console.error('❌ Error setting up button:', error);
            document.getElementById('message').textContent = 'Verification failed';
            document.getElementById('error').textContent = 'An error occurred. Please try again.';
            document.getElementById('error').style.display = 'block';
        }
    </script>
</body>
</html>
